name: Build & Push Image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# 不在容器内用 qemu 模拟，而是用各架构原生 runner 分别构建：
#   amd64  -> ubuntu-latest
#   arm64  -> ubuntu-24.04-arm
# 各自推送 :amd64 / :arm64 标签后，由 manifest 任务合并为 :latest 与 :<sha>
env:
  IMAGE: ghcr.io/felix2yu/qingye

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux/amd64, runner: ubuntu-latest, label: amd64 }
          - { platform: linux/arm64, runner: ubuntu-24.04-arm, label: arm64 }
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (${{ matrix.label }})
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.IMAGE }}:${{ matrix.label }}
          cache-from: type=gha,scope=${{ matrix.label }}
          cache-to: type=gha,scope=${{ matrix.label }},mode=max

  manifest:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifest
        run: |
          docker buildx imagetools create \
            --tag ${{ env.IMAGE }}:latest \
            ${{ env.IMAGE }}:amd64 \
            ${{ env.IMAGE }}:arm64
          docker buildx imagetools create \
            --tag ${{ env.IMAGE }}:${{ github.sha }} \
            ${{ env.IMAGE }}:amd64 \
            ${{ env.IMAGE }}:arm64

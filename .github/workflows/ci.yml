name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    uses: Felix2yu/.github/.github/workflows/reusable-test.yml@v1
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    with:
      go-dir: server
      test-packages: ./...
      web-dir: web

  image:
    needs: test
    permissions:
      contents: read
      packages: write
    uses: Felix2yu/.github/.github/workflows/reusable-image.yml@v1
    with:
      go-dir: server
      binary-name: qingye
      image-name: ghcr.io/felix2yu/qingye
      # 纯 Go SQLite 驱动（glebarez/sqlite），无需 CGO，静态编译即可
      cgo: off
      web-dir: web
      frontend-stage-command: |
        mkdir -p dist
        cp -R web/build/. dist/

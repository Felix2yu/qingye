name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  repository_dispatch:
    types: [base-image-updated]
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    uses: Felix2yu/.github/.github/workflows/reusable-test.yml@v1
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    with:
      go-dir: .
      test-packages: ./...
      web-dir: web
      # web 的 build 脚本只有 vite build，不做类型检查；不显式跑 check 的话
      # .svelte 里的类型错误可以躺在绿的 CI 上（同 diarum/guanfu 的处理）。
      web-build-command: pnpm run check && pnpm run build

  image:
    needs: test
    permissions:
      contents: read
      packages: write
    uses: Felix2yu/.github/.github/workflows/reusable-image.yml@v1
    with:
      go-dir: .
      # 入口已从 server/main.go 迁到 cmd/qingye/：main-package 的默认值是 "."，
      # 不显式传会在 Build binary 步骤失败（本地 go build 发现不了）
      main-package: ./cmd/qingye
      binary-name: qingye
      image-name: ghcr.io/felix2yu/qingye
      # 纯 Go SQLite 驱动（glebarez/sqlite），无需 CGO，静态编译即可
      cgo: off
      web-dir: web
      frontend-stage-command: |
        mkdir -p dist
        cp -R web/build/. dist/

services:
  qingye:
    # 本地构建（或改用已推送的镜像：image: ghcr.io/<owner>/qingye:latest）
    build: .
    image: qingye:local
    container_name: qingye
    restart: unless-stopped
    ports:
      - "${PORT:-8081}:8081"
    environment:
      PORT: "8081"
      DB_PATH: "/app/data/qingye.db"
      UPLOAD_DIR: "/app/uploads"
      WEB_DIR: "/app/web"
      CORS_ORIGINS: "*"
      GIN_MODE: "release"
      MAX_UPLOAD_MB: "10"
      # 可选：Plantbook 在线植物库 token（留空则禁用在线匹配）
      PLANTBOOK_TOKEN: "${PLANTBOOK_TOKEN:-}"
    volumes:
      - qingye-data:/app/data
      - qingye-uploads:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

volumes:
  qingye-data:
  qingye-uploads:

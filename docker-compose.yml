services:
  qingye:
    # 使用 CI 推送到 GHCR 的镜像（已含前后端，无需本地 build）
    image: ghcr.io/felix2yu/qingye:latest
    container_name: qingye
    restart: unless-stopped
    ports:
      - "${PORT:-8081}:8081"
    environment:
      PORT: "8081"
      DB_PATH: "/app/data/qingye.db"
      UPLOAD_DIR: "/app/uploads"
      WEB_DIR: "/app/web"
      CORS_ORIGINS: "*"
      GIN_MODE: "release"
      MAX_UPLOAD_MB: "10"
      # 外部备份工具（docker-db-auto-backup）经 docker exec 调用的自导出命令：
      # `/app/qingye backup` 把 VACUUM INTO 的 SQLite 一致性快照写到 stdout，只读、不跑迁移。
      # (a) 这一条必须显式声明：二进制装在 /app 而 /app 不在 PATH 上，命令必须写成绝对路径，
      #     裸名经 sh -c 解析会 exit 127。
      # (b) 想连带照片日记的图片一起备份，把命令改成 "/app/qingye backup --format zip"，
      #     并同步声明 BACKUP_SQLITE_EXT: "zip"，否则工具会按 SQLite 魔数校验 zip 产物，
      #     本轮备份直接判失败（不静默存坏备份）。
      # (c) 导出身份沿用基镜烘入的 PUID/PGID（与数据属主一致），无需 BACKUP_SQLITE_USER。
      BACKUP_SQLITE_CMD: "/app/qingye backup"
      # 可选：Plantbook 在线植物库 OAuth2 凭据（open.plantbook.io 注册获取，留空则禁用在线匹配）
      PLANTBOOK_CLIENT_ID: "${PLANTBOOK_CLIENT_ID:-}"
      PLANTBOOK_CLIENT_SECRET: "${PLANTBOOK_CLIENT_SECRET:-}"
      PLANTBOOK_ACCESS_TOKEN: "${PLANTBOOK_ACCESS_TOKEN:-}"
    volumes:
      - qingye-data:/app/data
      - qingye-uploads:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

volumes:
  qingye-data:
  qingye-uploads:

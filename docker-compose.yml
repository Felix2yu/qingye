services:
  qingye:
    # 使用 CI 推送到 GHCR 的镜像（已含前后端，无需本地 build）
    image: ghcr.io/felix2yu/qingye:latest
    container_name: qingye
    restart: unless-stopped
    ports:
      - "${PORT:-8081}:8081"
    environment:
      PORT: "8081"
      DB_PATH: "/app/data/qingye.db"
      UPLOAD_DIR: "/app/uploads"
      WEB_DIR: "/app/web"
      CORS_ORIGINS: "*"
      GIN_MODE: "release"
      MAX_UPLOAD_MB: "10"
      # 可选：Plantbook 在线植物库 OAuth2 凭据（open.plantbook.io 注册获取，留空则禁用在线匹配）
      PLANTBOOK_CLIENT_ID: "${PLANTBOOK_CLIENT_ID:-}"
      PLANTBOOK_CLIENT_SECRET: "${PLANTBOOK_CLIENT_SECRET:-}"
      PLANTBOOK_ACCESS_TOKEN: "${PLANTBOOK_ACCESS_TOKEN:-}"
    volumes:
      - qingye-data:/app/data
      - qingye-uploads:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

volumes:
  qingye-data:
  qingye-uploads:
